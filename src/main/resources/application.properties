spring.application.name=flashcards
server.port=8077

# Local app: never serve a stale page or stylesheet after an edit.
spring.web.resources.cache.period=0

# Every file in this directory becomes a deck, named after the file. It is read straight off
# disk, so renaming or deleting a deck takes effect on the next start - no rebuild, and no
# stale copies left behind in target/. An absolute path works too.
flashcards.words-dir=words

# Optional recordings, named after the Thai word: audio/แด่.mp3, audio/หลุมดำ.mp3, ...
# Words without a file are spoken by the browser's own Thai voice instead.
flashcards.audio-dir=audio
