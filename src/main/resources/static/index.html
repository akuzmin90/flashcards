<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Thai Trainer</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇹🇭</text></svg>">
	<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
	<div class="tabs-row">
		<nav class="tabs tabs-apps" id="app-tabs">
			<button type="button" class="tab is-active" data-app="flashcards">Flashcards</button>
			<button type="button" class="tab" data-app="tones">Tones</button>
		</nav>
		<div class="topbar-actions">
			<button type="button" class="icon-btn" id="btn-sound" title="Mute pronunciation" aria-label="Mute pronunciation">
				<svg class="icon-sound-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
						stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
					<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
					<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
				</svg>
				<svg class="icon-sound-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
						stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
					<line x1="23" y1="9" x2="17" y2="15"></line>
					<line x1="17" y1="9" x2="23" y2="15"></line>
				</svg>
			</button>
			<button type="button" class="icon-btn" id="btn-reset" title="Restart session" aria-label="Restart session">
				<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
						stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<polyline points="23 4 23 10 17 10"></polyline>
					<path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
				</svg>
			</button>
		</div>
	</div>

	<div id="flashcards-bar">
		<nav class="tabs tabs-decks" id="deck-tabs" hidden></nav>

		<nav class="tabs tabs-modes" id="tabs">
			<button type="button" class="tab is-active" data-mode="easy">Easy</button>
			<button type="button" class="tab" data-mode="mixed" title="Both directions plus the letter builder">Mixed</button>
			<button type="button" class="tab" data-mode="let" title="Only spelling the Thai word from its letters">Let</button>
			<button type="button" class="tab" data-mode="to-thai" title="Always translate into Thai">2 Thai</button>
			<button type="button" class="tab" data-mode="auto" title="Hands free: reads each word and its translation, then moves on">Auto</button>
		</nav>

		<div class="scoreboard">
			<div class="stat stat-correct">
				<span class="stat-label">Correct</span>
				<span class="stat-value" id="stat-correct">0</span>
			</div>
			<div class="stat stat-incorrect">
				<span class="stat-label">Incorrect</span>
				<span class="stat-value" id="stat-incorrect">0</span>
			</div>
			<div class="stat stat-remaining">
				<span class="stat-label">Words left</span>
				<span class="stat-value"><span id="stat-remaining">0</span> <span class="stat-total">/ <span id="stat-total">0</span></span></span>
			</div>
		</div>
	</div>

	<div id="tones-bar" hidden>
		<div class="scoreboard">
			<div class="stat stat-correct">
				<span class="stat-label">Streak</span>
				<span class="stat-value" id="tone-streak">0</span>
			</div>
			<div class="stat">
				<span class="stat-label">Best</span>
				<span class="stat-value" id="tone-best">0</span>
			</div>
			<div class="stat">
				<span class="stat-label">Correct</span>
				<span class="stat-value"><span id="tone-correct">0</span> <span class="stat-total">/ <span id="tone-total">0</span></span></span>
			</div>
		</div>
	</div>

	<div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
</header>

<main>

	<div class="app-root" id="flashcards-app">

		<section id="card-screen" class="screen">
			<div class="card">
				<div class="question">
					<div class="thai" id="question-thai" hidden></div>
					<div class="transcription" id="question-transcription" hidden></div>
					<button type="button" class="say" id="say-question" title="Play pronunciation" aria-label="Play pronunciation" hidden>
						<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
								stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
							<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
							<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
						</svg>
					</button>
					<div class="english" id="question-english" hidden></div>
				</div>
				<div class="answer" id="answer" hidden>
					<div class="thai" id="answer-thai" hidden></div>
					<div class="transcription" id="answer-transcription" hidden></div>
					<button type="button" class="say" id="say-answer" title="Play pronunciation" aria-label="Play pronunciation" hidden>
						<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
								stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
							<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
							<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
						</svg>
					</button>
					<div class="english" id="answer-english" hidden></div>
				</div>
			</div>

			<div class="builder" id="builder" hidden>
				<div class="slots" id="slots"></div>
				<div class="pool" id="pool"></div>
			</div>

			<div class="typing" id="typing" hidden>
				<input type="text" id="answer-input" class="answer-input" lang="th" placeholder="Type it in Thai"
						autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
			</div>

			<p class="grade" id="grade" hidden></p>

			<div class="controls">
				<button type="button" class="btn btn-show" id="btn-show">Show answer</button>
				<button type="button" class="btn btn-giveup" id="btn-giveup" hidden>Give up</button>
				<button type="button" class="btn btn-show" id="btn-next" hidden>Next</button>
				<button type="button" class="btn btn-giveup" id="btn-auto" hidden>Pause</button>
				<div class="verdict" id="verdict" hidden>
					<button type="button" class="btn btn-incorrect" id="btn-incorrect">Incorrect</button>
					<button type="button" class="btn btn-correct" id="btn-correct">Correct</button>
				</div>
			</div>

			<p class="hint" id="hint">Space — show answer</p>
		</section>

		<section id="results-screen" class="screen" hidden>
			<h1 class="results-title">Session complete</h1>
			<p class="results-subtitle" id="results-subtitle"></p>
			<div class="results-grid">
				<div class="result-tile result-correct">
					<span class="result-value" id="result-correct">0</span>
					<span class="result-label">Correct answers</span>
				</div>
				<div class="result-tile result-incorrect">
					<span class="result-value" id="result-incorrect">0</span>
					<span class="result-label">Mistakes</span>
				</div>
				<div class="result-tile result-total">
					<span class="result-value" id="result-total">0</span>
					<span class="result-label">Words learned</span>
				</div>
			</div>
			<button type="button" class="btn btn-show" id="btn-restart">Start again</button>
		</section>

		<section id="error-screen" class="screen" hidden>
			<h1 class="results-title">Nothing to study</h1>
			<p class="results-subtitle" id="error-message"></p>
		</section>

	</div>

	<div class="app-root" id="tones-app" hidden>

		<section id="tones-screen" class="screen">
			<div class="card tones-card">
				<div class="syllable" id="syllable"></div>
				<button type="button" class="say" id="say-syllable" title="Play pronunciation" aria-label="Play pronunciation" hidden>
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
							stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
						<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
						<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
					</svg>
				</button>
			</div>

			<div class="tone-grid" id="tone-grid"></div>

			<div class="tone-result" id="tone-result" hidden>
				<p class="grade" id="tone-grade"></p>
				<p class="tone-rule" id="tone-rule"></p>
				<div class="tone-chips" id="tone-chips"></div>
			</div>

			<div class="controls">
				<button type="button" class="btn btn-show" id="tone-next" hidden>Next</button>
			</div>

			<p class="hint" id="tone-hint">Which tone is it? · keys 1–5</p>
		</section>

		<section id="tones-error" class="screen" hidden>
			<h1 class="results-title">Tones unavailable</h1>
			<p class="results-subtitle" id="tones-error-message"></p>
		</section>

	</div>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
